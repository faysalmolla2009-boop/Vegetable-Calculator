<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রোডাক্ট ক্যালকুলেটর</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1d2733;
    --muted: #6b7785;
    --accent: #1f7a5a;
    --border: #dde3ea;
    --danger: #b03a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans Bengali", "Nirmala UI", "Vrinda", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    font-size: 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 12px;
    font-family: inherit;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 1rem;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
  }
  button.secondary { background: transparent; color: var(--danger); border: 1px solid var(--border); width: auto; padding: 6px 10px; font-size: 0.85rem; }
  .result {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  @media (max-width: 480px) { .result { grid-template-columns: 1fr; } }
  .stat {
    background: #f0f7f4;
    border-radius: 10px;
    padding: 12px;
  }
  .stat .k { font-size: 0.85rem; color: var(--muted); }
  .stat .v { font-size: 1.25rem; font-weight: 600; margin-top: 4px; }
  .stat.sell .v { color: var(--accent); }
  .error { color: var(--danger); font-size: 0.9rem; margin-top: 8px; min-height: 1em; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 14px 0; }
  .head-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  h2 { font-size: 1.05rem; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>প্রোডাক্ট ক্যালকুলেটর</h1>

  <div class="card">
    <label for="name">প্রোডাক্টের নাম</label>
    <input id="name" type="text" placeholder="যেমন: চাল">

    <div class="row">
      <div>
        <label for="price">মোট কেনা দাম (টাকা)</label>
        <input id="price" type="number" min="0" step="any" placeholder="যেমন: 5000">
      </div>
      <div>
        <label for="weight">মোট ওজন (কেজি)</label>
        <input id="weight" type="number" min="0" step="any" placeholder="যেমন: 100">
      </div>
    </div>

    <label for="profit">কাঙ্ক্ষিত লাভ (%)</label>
    <input id="profit" type="number" min="0" step="any" value="20">

    <button id="calc">হিসাব করুন</button>
    <div class="error" id="error"></div>

    <div class="result" id="result" hidden>
      <div class="stat">
        <div class="k">প্রতি কেজি কেনা পড়েছে</div>
        <div class="v" id="costPerKg">-</div>
      </div>
      <div class="stat sell">
        <div class="k">প্রতি কেজি বিক্রি করতে হবে</div>
        <div class="v" id="sellPerKg">-</div>
      </div>
      <div class="stat">
        <div class="k">প্রতি কেজিতে লাভ</div>
        <div class="v" id="profitPerKg">-</div>
      </div>
      <div class="stat">
        <div class="k">সব বিক্রি করলে মোট আয়</div>
        <div class="v" id="totalSell">-</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="head-row">
      <h2>হিসাব করা প্রোডাক্টের তালিকা</h2>
      <button class="secondary" id="clearAll">সব মুছুন</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>প্রোডাক্ট</th>
          <th class="num">ওজন (কেজি)</th>
          <th class="num">দাম (টাকা)</th>
          <th class="num">কেজি প্রতি কেনা</th>
          <th class="num">কেজি প্রতি বিক্রি</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
    <div class="empty" id="emptyMsg">এখনো কোনো প্রোডাক্ট যোগ করা হয়নি</div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const STORE_KEY = "productCalcItems";
  let items = [];

  function loadItems() {
    try {
      items = JSON.parse(localStorage.getItem(STORE_KEY)) || [];
    } catch (e) {
      items = [];
    }
  }

  function saveItems() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(items));
    } catch (e) { /* storage not available, keep in memory */ }
  }

  function fmt(n) {
    return Number(n).toLocaleString("bn-BD", { maximumFractionDigits: 2 }) + " টাকা";
  }

  function calculate() {
    const name = $("name").value.trim();
    const price = parseFloat($("price").value);
    const weight = parseFloat($("weight").value);
    const profit = parseFloat($("profit").value);
    const err = $("error");
    err.textContent = "";

    if (!(price > 0) || !(weight > 0)) {
      err.textContent = "দাম এবং ওজন দুটোই শূন্যের বেশি দিতে হবে।";
      $("result").hidden = true;
      return null;
    }
    if (isNaN(profit) || profit < 0) {
      err.textContent = "লাভের হার সঠিকভাবে লিখুন।";
      $("result").hidden = true;
      return null;
    }

    const costPerKg = price / weight;
    const sellPerKg = costPerKg * (1 + profit / 100);
    const profitPerKg = sellPerKg - costPerKg;
    const totalSell = sellPerKg * weight;

    $("costPerKg").textContent = fmt(costPerKg);
    $("sellPerKg").textContent = fmt(sellPerKg);
    $("profitPerKg").textContent = fmt(profitPerKg);
    $("totalSell").textContent = fmt(totalSell);
    $("result").hidden = false;

    return { name: name || "নামহীন", price, weight, costPerKg, sellPerKg };
  }

  function render() {
    const list = $("list");
    list.innerHTML = "";
    items.forEach((it, idx) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td></td>
        <td class="num">${Number(it.weight).toLocaleString("bn-BD")}</td>
        <td class="num">${Number(it.price).toLocaleString("bn-BD")}</td>
        <td class="num">${Number(it.costPerKg).toLocaleString("bn-BD", { maximumFractionDigits: 2 })}</td>
        <td class="num">${Number(it.sellPerKg).toLocaleString("bn-BD", { maximumFractionDigits: 2 })}</td>
        <td><button class="secondary" data-idx="${idx}">মুছুন</button></td>`;
      tr.querySelector("td").textContent = it.name;
      list.appendChild(tr);
    });
    $("emptyMsg").hidden = items.length > 0;
  }

  $("calc").addEventListener("click", () => {
    const r = calculate();
    if (!r) return;
    items.push(r);
    saveItems();
    render();
  });

  $("list").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-idx]");
    if (!btn) return;
    items.splice(Number(btn.dataset.idx), 1);
    saveItems();
    render();
  });

  $("clearAll").addEventListener("click", () => {
    if (!items.length) return;
    if (confirm("সব প্রোডাক্ট মুছে ফেলতে চান?")) {
      items = [];
      saveItems();
      render();
    }
  });

  loadItems();
  render();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
